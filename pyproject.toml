[project]
name = "insurance-claim-mcp"
version = "0.1.0"
description = "FastAPI + MCP service that matches medical receipts against insurance policies (informational estimates only)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "fastmcp==4.1.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
