[project]
name = "insurance-claim-mcp-v2"
version = "0.1.0"
description = "Isolated MCP infrastructure for insurance agents and agencies."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "fastmcp==4.1.0",
    "psycopg[binary]==3.2.12",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "PyYAML==6.0.3",
    "ruff==0.14.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_mcp_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
