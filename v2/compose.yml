name: insurance-claim-v2

x-v2-environment: &v2-environment
  V2_ENVIRONMENT: test
  V2_DATABASE_URL: postgresql+psycopg://claim_v2:${V2_POSTGRES_PASSWORD:?Set V2_POSTGRES_PASSWORD}@db-v2:5432/insurance_claim_v2
  V2_DATABASE_PROJECT_ID: compose-v2
  V2_APP_VERSION: ${V2_APP_VERSION:-local-v2}

services:
  db-v2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insurance_claim_v2
      POSTGRES_USER: claim_v2
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Set V2_POSTGRES_PASSWORD}
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim_v2 -d insurance_claim_v2"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate-v2:
    build: .
    command: ["python", "-m", "claim_mcp_v2.db", "migrate"]
    environment: *v2-environment
    depends_on:
      db-v2:
        condition: service_healthy
  app-v2:
    build: .
    environment: *v2-environment
    depends_on:
      migrate-v2:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${V2_PORT:-8082}:8080"

volumes:
  pgdata-v2:
