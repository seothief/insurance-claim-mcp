name: Deploy to Cloud Run

# Automatically deploys main after CI passes; workflow_dispatch also allows one-click deploys.
# Manual runs are restricted to main. Requires repository variables and secrets:
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.GAR_REPOSITORY (Artifact Registry repo name)
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER, secrets.GCP_SERVICE_ACCOUNT
# The Cloud Run service account must already have Secret Manager access for DATABASE_URL and API_KEY.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      SERVICE: insurance-claim-mcp
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/insurance-claim-mcp:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Resolve Cloud Run URL
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          test -n "$url"
          echo "PUBLIC_BASE_URL=$url" >> "$GITHUB_ENV"
      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --update-env-vars "APP_VERSION=${IMAGE##*:},SEED_SAMPLE_DATA=false,PUBLIC_BASE_URL=$PUBLIC_BASE_URL" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,API_KEY=API_KEY:latest"
      - name: Verify deployment
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 5 --retry-connrefused -fsS "$PUBLIC_BASE_URL/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl -fsS "$PUBLIC_BASE_URL/api/version" | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["EXPECTED_VERSION"]'
          curl -fsS "$PUBLIC_BASE_URL/llms.txt" > /dev/null
        env:
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
