name: Publish

# Push a tag like v0.2.0 to build, publish to PyPI (Trusted Publishing, no token) and update the
# official MCP Registry (GitHub OIDC, no login). The tag must match pyproject.toml and server.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          srv=$(python -c "import json;d=json.load(open('server.json'));print(d['version'], d['packages'][0]['version'])")
          echo "tag=$tag pyproject=$py server.json=$srv"
          [ "$py" = "$tag" ] && [ "$srv" = "$tag $tag" ]
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/insurance-claim-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          version=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/insurance-claim-mcp/$version/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI release $version not visible yet" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
