name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          grep -viE '^(pywin32|pywin32-ctypes)' requirements.lock.txt > requirements.linux.txt
          pip install -r requirements.linux.txt
      - run: ruff check src tests scripts
      - run: mypy src

  test-sqlite:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          grep -viE '^(pywin32|pywin32-ctypes)' requirements.lock.txt > requirements.linux.txt
          pip install -r requirements.linux.txt
      - name: pytest (SQLite default)
        run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: claim_service
          POSTGRES_USER: claim
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claim -d claim_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claim:ci_only_password@localhost:5432/claim_service
      TEST_DATABASE_URL: postgresql+psycopg://claim:ci_only_password@localhost:5432/claim_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          grep -viE '^(pywin32|pywin32-ctypes)' requirements.lock.txt > requirements.linux.txt
          pip install -r requirements.linux.txt
      - name: pytest against PostgreSQL 16
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start app + PostgreSQL via compose
        run: docker compose up -d --build --wait
      - name: Issue a per-user smoke-test key inside the app container
        run: |
          set -e
          docker compose exec -T app python -c "
          import sys
          sys.path.insert(0, 'src')
          from claim_service.config import get_settings
          from claim_service.db.engine import create_db_engine, init_schema
          from claim_service.db.repository import PolicyRepository
          from claim_service.domain.security import api_key_prefix, generate_api_key, hash_api_key

          engine = create_db_engine(get_settings().database_url)
          init_schema(engine)
          repo = PolicyRepository(engine)
          repo.ensure_user('ci_smoke')
          raw = generate_api_key()
          repo.create_api_key('ci_smoke', hash_api_key(raw), api_key_prefix(raw))
          print(raw)
          " | tail -n 1 | tr -d '\r' > smoke_key.txt
          test -s smoke_key.txt
      - name: Smoke test MCP endpoint with the per-user key
        run: |
          set -e
          curl -fsS http://localhost:8080/api/health
          KEY=$(cat smoke_key.txt)
          status=$(curl -sS -o mcp-response.txt -w '%{http_code}' -X POST http://localhost:8080/mcp/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H "X-User-Key: $KEY" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "MCP initialize HTTP status: $status"
          cat mcp-response.txt
          test "$status" = "200"
          unauth=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "MCP without key HTTP status: $unauth"
          test "$unauth" = "401"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
